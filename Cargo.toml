[workspace]
members = ["crates/odin-core", "crates/odin-protocol", "crates/odin-engine", "crates/odin"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.17"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = "=0.7.16"
clap = { version = "=4.5.50", features = ["derive"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
regex = "=1.12.2"
globset = "=0.4.18"
ignore = "=0.4.24"
url = "=2.5.7"
fs2 = "=0.4.3"
tempfile = "=3.23.0"
similar = "=2.7.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "=0.8.6"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
