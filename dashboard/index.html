<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odin · Local Console</title>
<style>
:root{--bg:#f4f3ef;--ink:#152331;--muted:#5b6570;--line:#ced3d6;--accent:#007b83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","Noto Sans TC",sans-serif}header{border-bottom:1px solid var(--line);padding:24px 6%;display:flex;align-items:center;gap:24px}h1{font-size:32px;letter-spacing:.08em;margin:0}header p{color:var(--muted);margin:0}main{max-width:1280px;margin:40px auto;padding:0 28px}h2{font-size:22px;margin:0 0 16px}section{margin:24px 0;padding:24px;border:1px solid var(--line);border-radius:2px;background:#fff}input,button,select{font:inherit;border:1px solid var(--line);border-radius:2px;padding:10px 14px}input{width:min(520px,100%)}button{background:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin-bottom:8px}.note{font-size:14px;color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:600}.scroll{overflow:auto}#message{white-space:pre-wrap;color:var(--muted)}code{font-family:Consolas,monospace}footer{font-size:13px;color:var(--muted);padding:28px 0}a{color:var(--accent)}</style>
<header><h1>ODIN</h1><p>Rust 核心 · 本機程式語意工具</p></header><main>
<section><h2>連線</h2><label for="token">本機 Bearer Token</label><div class="row"><input type="password" id="token" autocomplete="off" placeholder="啟動 HTTP 時設定的 ODIN_TOKEN"><button id="connect">讀取狀態</button></div><p class="note">Token 僅保留在此頁記憶體，不寫入網址、Cookie 或 localStorage。此介面只讀；不提供改檔或命令執行按鈕。</p><div id="message" role="status"></div></section>
<section><h2>專案邊界</h2><div class="scroll"><table><thead><tr><th>專案</th><th>Root</th><th>寫入</th><th>Shell</th><th>Debug</th><th>語言後端</th></tr></thead><tbody id="projects"></tbody></table></div></section>
<section><div class="row"><h2>工具操作紀錄</h2><select id="project" aria-label="選擇專案"></select><button id="refresh">重新讀取</button></div><p class="note">紀錄只含工具名稱、狀態與時間，不保存原始程式碼輸入輸出。</p><div class="scroll"><table><thead><tr><th>時間</th><th>工具</th><th>結果</th><th>耗時</th><th>錯誤碼</th></tr></thead><tbody id="audit"></tbody></table></div></section>
<footer>Odin 0.2.0 · Standalone source preview · 無 Serena 橋接；語言伺服器與 Debugger 須分別驗收。原生路徑政策不等於作業系統沙箱。</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let token='';
async function api(path){const response=await fetch(path,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${await response.text()}`);return response.json();}
function cell(row,value){const td=document.createElement('td');td.textContent=String(value??'—');row.append(td);}
async function loadAudit(){const id=$('project').value;if(!id)return;const data=await api('/api/audit/'+encodeURIComponent(id));$('audit').replaceChildren();for(const entry of data.entries){const tr=document.createElement('tr');for(const value of [new Date(entry.at_ms).toLocaleString(),entry.tool,entry.ok?'呼叫成功':'呼叫失敗',entry.elapsed_ms+' ms',entry.error_code])cell(tr,value);$('audit').append(tr);}}
$('connect').onclick=async()=>{token=$('token').value;$('message').textContent='';try{const data=await api('/api/projects');$('projects').replaceChildren();$('project').replaceChildren();for(const p of data.projects){const tr=document.createElement('tr');for(const value of [p.id,p.root,p.allow_write,p.allow_shell,p.allow_debug,p.languages.join(', ')])cell(tr,value);$('projects').append(tr);const option=document.createElement('option');option.value=p.id;option.textContent=p.id;$('project').append(option);}await loadAudit();$('message').textContent='已讀取本機狀態。';}catch(error){$('message').textContent=String(error);}};
$('refresh').onclick=()=>loadAudit().catch(e=>{$('message').textContent=String(e);});$('project').onchange=$('refresh').onclick;
</script></html>
